[workspace]
members = [".", "xtask"]
# cargo build / cargo test cover the library only; xtask compiles flatc.
default-members = ["."]

[package]
name = "tosa-interp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# Must match the flatc version used by cargo xtask codegen (flatc-fork).
flatbuffers = "25.12.19"
half = { version = "2", features = ["num-traits"] }
libm = "0.2.16"
thiserror = "2"

[dev-dependencies]
libtest-mimic = "0.8.2"
npyz = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "conformance"
harness = false
